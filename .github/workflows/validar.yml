name: validar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes do motor de tasks
        run: python3 -m unittest discover -s tests -v
      - name: Validar exemplo e isolamento de contexto
        run: |
          python3 skills/planejamento-de-sistemas/scripts/fluxo.py --repo examples/fluxo-v2 validar
          python3 skills/planejamento-de-sistemas/scripts/fluxo.py --repo examples/fluxo-v2 prontas
          python3 skills/planejamento-de-sistemas/scripts/fluxo.py --repo examples/fluxo-v2 contexto S01-P01-T01 --saida /tmp/task-atual.md
          grep -q 'Contrato de login' /tmp/task-atual.md
          if grep -q 'Memória de domínio — interface' /tmp/task-atual.md; then
            echo 'Vazamento de contexto de design numa task de backend' >&2
            exit 1
          fi
      - name: Rejeitar resíduos de protocolos antigos
        run: |
          if grep -RinE 'fluxo-v1|(^|[^[:alnum:]])v1([^[:alnum:]]|$)|1\.x|validar\.py|test_validador' \
            README.md docs/ skills/ examples/ tests/ .claude-plugin/ --include='*.md' --include='*.py' --include='*.json'; then
            echo 'Referência a protocolo removido detectada' >&2
            exit 1
          fi
      - name: Build da distribuição
        run: ./build.sh
      - name: Integridade e reprodutibilidade
        run: |
          unzip -t dist/planejamento-de-sistemas.skill
          grep -q 'ARQUIVO: references/fluxo-v2.md' dist/planejamento-de-sistemas-completo.md
          if unzip -Z1 dist/planejamento-de-sistemas.skill | grep -E '(validar.py|fluxo-v1|__pycache__/|\.pyc$|\.pyo$)'; then
            echo 'Arquivo indevido no pacote' >&2
            exit 1
          fi
          sha256sum dist/planejamento-de-sistemas.skill dist/planejamento-de-sistemas-completo.md > /tmp/dist-sha256
          ./build.sh
          sha256sum -c /tmp/dist-sha256
