name: validar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes do validador
        run: python3 -m unittest discover -s tests -v
      - name: Validar demonstração
        run: python3 skills/planejamento-de-sistemas/scripts/validar.py examples/caixafuturo/especificacao --strict
      - name: Build da distribuição
        run: ./build.sh
      - name: Verificar integridade dos pacotes
        run: |
          unzip -t dist/planejamento-de-sistemas.skill
          grep -q 'ARQUIVO: references/planejamento-mvp.md' dist/planejamento-de-sistemas-completo.md
